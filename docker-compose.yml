services:
  runtime-init:
    build:
      context: ./scripts/docker
    command: ["python", "/tools/runtime_init.py"]
    volumes:
      - runtime_secrets:/run/kb-secrets
      - content_data:/data
      - postgres_data:/database:ro
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD_FILE: /run/kb-secrets/current/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
        volume:
          nocopy: true
      - runtime_secrets:/run/kb-secrets:ro
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.11
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/models
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  models-init:
    build:
      context: ./scripts/docker
    command: ["python", "/tools/models_init.py"]
    environment:
      OLLAMA_URL: http://ollama:11434
      # Only an explicit isolated E2E override may skip model preparation.
      SKIP_MODEL_INIT: "false"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowledge_base}
      DB_USERNAME: ${POSTGRES_USER:-kb_user}
      DB_PASSWORD_FILE: /run/kb-secrets/current/db_password
      JWT_SECRET_KEY_FILE: /run/kb-secrets/current/jwt_secret
      GIT_REPO_PATH: /data/git
      BLOB_STORAGE_PATH: /data/blobs
      AI_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "false"
      SPRING_LIQUIBASE_CONTEXTS: rag
      RAG_ENABLED: "true"
      RAG_BASE_URL: http://ollama:11434
      RAG_EMBEDDING_MODEL: qwen3-embedding:0.6b
      RAG_EMBEDDING_DIMENSIONS: "1024"
      RAG_GENERATION_MODEL: qwen3:4b
      RAG_TIMEOUT_SECONDS: "120"
      # Empty override disables prod's file appender; container logs remain on stdout.
      LOGGING_FILE_NAME: ""
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - type: volume
        source: content_data
        target: /data
        volume:
          nocopy: true
      - runtime_secrets:/run/kb-secrets:ro
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      models-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  e2e:
    build:
      context: ./tests/E2E
      dockerfile: Dockerfile
    profiles: ["e2e"]
    environment:
      E2E_BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    command: ["npx", "playwright", "test", "--workers=1"]

volumes:
  postgres_data:
  content_data:
  ollama_data:
  runtime_secrets:
