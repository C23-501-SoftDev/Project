services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_UID: ${UID:-1000}
        APP_GID: ${GID:-1000}
    container_name: kb_app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GIT_REPO_PATH: /workspace
      # SSH URL репозитория для git push/pull (например: git@github.com:USERNAME/REPO.git)
      # Используется для быстрой установки remote: git remote set-url origin $GIT_REPO_SSH_URL
      GIT_REPO_SSH_URL: ${GIT_REPO_SSH_URL}
      # Для проброса SSH-агента (рекомендуемый способ для доступа к приватным репо):
      # 1) Убедитесь, что на хосте запущен ssh-agent и переменная SSH_AUTH_SOCK экспортирована.
      # 2) Раскомментируйте mapping в секции volumes ниже и эту строку (если хотите указать путь внутри контейнера).
      # SSH_AUTH_SOCK: /ssh-agent
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      # Проброс глобального git-конфига пользователя, чтобы внутри контейнера
      # git использовал те же user.name / user.email и другие настройки.
      # Если нужно, чтобы контейнер мог менять конфиг — уберите ":ro".
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      # (Опционально) проброс SSH-ключей для доступа к приватным репозиториям.
      # 1) Вариант A — проброс SSH-агента (рекомендуется):
      # - ${SSH_AUTH_SOCK}:/ssh-agent
      #    и раскомментировать переменную окружения выше: SSH_AUTH_SOCK: /ssh-agent
      #    Этот способ безопаснее, ключи остаются на хосте, контейнер использует агент.
      # 2) Вариант B — проброс директории ~/.ssh (используется в настоящее время):
      - ${HOME}/.ssh:/home/app/.ssh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  postgres:
    image: postgres:18-alpine
    container_name: kb_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  e2e:
    image: mcr.microsoft.com/playwright:latest
    container_name: kb_e2e
    profiles: ["e2e"]
    working_dir: /e2e
    environment:
      E2E_BASE_URL: http://app:8080
    volumes:
      - ./tests/E2E:/e2e
    depends_on:
      app:
        condition: service_healthy
    command: >
      bash -lc "npm ci && npx playwright test"

volumes:
  postgres_data:
