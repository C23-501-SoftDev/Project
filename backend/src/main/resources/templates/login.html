<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-page">
    <div class="login-card">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <svg class="logo-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--primary-color);">
                <path d="M2 6C2 4.89543 2.89543 4 4 4H12V18H4C2.89543 18 2 17.1046 2 16V6Z" fill="var(--primary-light)" stroke="currentColor" stroke-width="2"/>
                <path d="M22 6C22 4.89543 21.1046 4 20 4H12V18H20C21.1046 18 22 17.1046 22 16V6Z" fill="var(--primary-light)" stroke="currentColor" stroke-width="2"/>
                <path d="M12 4V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M5 8H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <path d="M5 11H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <path d="M15 8H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <path d="M15 11H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            </svg>
            <h1 style="margin: 0;">База знаний</h1>
        </div>
        <p class="subtitle">Авторизуйтесь для доступа к документам</p>
    
        <div id="loginToast" class="toast error" th:classappend="${errorMessage != null ? 'show' : ''}">
            <span id="toastMessage" th:text="${errorMessage}">Неверный логин или пароль</span>
        </div>
    
        <form th:action="@{/login}" method="post" id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="button-primary">Войти</button>
            </div>
        </form>
    
        <div class="api-test">
            <h2>Тестирование API</h2>
            <p><code>POST /api/auth/login</code></p>
            <p><a href="/swagger-ui.html">Swagger UI</a></p>
        </div>
    </div>

    <script>
        // Show toast notification on page load if there's an error
        document.addEventListener('DOMContentLoaded', function() {
            var toast = document.getElementById('loginToast');
            if (toast && toast.classList.contains('show')) {
                // Auto-hide after 5 seconds
                setTimeout(function() {
                    toast.classList.remove('show');
                }, 5000);
            }
        });

        // Form submission: show loading state, handle errors
        document.getElementById('loginForm').addEventListener('submit', function() {
            var submitBtn = this.querySelector('.button-primary');
            submitBtn.textContent = 'Вход...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
