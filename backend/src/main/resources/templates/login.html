<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Вход в Базу знаний</h1>
        <p class="subtitle">Авторизуйтесь для доступа к документам</p>
    
        <div id="loginToast" class="toast error" th:classappend="${errorMessage != null ? 'show' : ''}">
            <span id="toastMessage" th:text="${errorMessage}">Неверный логин или пароль</span>
        </div>
    
        <form th:action="@{/login}" method="post" id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="button-primary">Войти</button>
            </div>
        </form>
    
        <div class="api-test">
            <h2>Тестирование API</h2>
            <p><code>POST /api/auth/login</code></p>
            <p><a href="/swagger-ui.html">Swagger UI</a></p>
        </div>
    </div>

    <script>
        // Show toast notification on page load if there's an error
        document.addEventListener('DOMContentLoaded', function() {
            var toast = document.getElementById('loginToast');
            if (toast && toast.classList.contains('show')) {
                // Auto-hide after 5 seconds
                setTimeout(function() {
                    toast.classList.remove('show');
                }, 5000);
            }
        });

        // Form submission: show loading state, handle errors
        document.getElementById('loginForm').addEventListener('submit', function() {
            var submitBtn = this.querySelector('.button-primary');
            submitBtn.textContent = 'Вход...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
