<div class="document-new-page" style="padding: 32px 40px;">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h1 style="font-size: 24px; font-weight: 700; margin: 0;">Создать документ</h1>
        <a href="/" class="button-secondary" style="text-decoration:none;">&larr; К списку</a>
    </div>

    <div class="form-container" style="max-width:600px; background:#fff; padding:24px; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); border: 1px solid var(--border-color);">
        <form id="createDocForm" onsubmit="return false;">
            <div class="form-group" style="margin-bottom:16px;">
                <label style="display:block; font-size:12px; font-weight:700; color:var(--secondary-color); text-transform:uppercase; margin-bottom:6px;">Название *</label>
                <input type="text" id="docTitle" class="form-input" placeholder="Введите название документа" required>
            </div>
            
            <div class="form-group" style="margin-bottom:16px;">
                <label style="display:block; font-size:12px; font-weight:700; color:var(--secondary-color); text-transform:uppercase; margin-bottom:6px;">Пространство *</label>
                <div class="custom-select" id="docSpaceWrapper" data-name="docSpace">
                    <div class="select-styled">Выберите пространство...</div>
                    <div class="select-options"></div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:16px;">
                <label style="display:block; font-size:12px; font-weight:700; color:var(--secondary-color); text-transform:uppercase; margin-bottom:6px;">Шаблон (опционально)</label>
                <div class="custom-select" id="docTemplateWrapper" data-name="docTemplate">
                    <div class="select-styled">Не использовать шаблон</div>
                    <div class="select-options"></div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:16px;">
                <label style="display:block; font-size:12px; font-weight:700; color:var(--secondary-color); text-transform:uppercase; margin-bottom:6px;">Родительский документ (опционально)</label>
                <div class="custom-select" id="docParentWrapper" data-name="docParent">
                    <div class="select-styled">Без родителя (корневой)</div>
                    <div class="select-options"></div>
                </div>
            </div>
            
            <input type="hidden" id="docSpace">
            <input type="hidden" id="docTemplate">
            <input type="hidden" id="docParent">

            <div class="form-group" style="margin-bottom:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label style="font-size:12px; font-weight:700; color:var(--secondary-color); text-transform:uppercase;">Начальный контент (Markdown)</label>
                    <div class="ai-assistant" id="aiAssistant" style="position:relative; display:none;">
                        <button type="button" class="button-secondary" id="aiAssistBtn" style="padding:4px 10px; font-size:12px; min-width:auto;" title="Нейроассистент — изменить тип текста">✨ Нейроассистент</button>
                        <div id="aiAssistPanel" style="display:none; position:absolute; right:0; top:112%; z-index:50; background:#fff; border:1px solid var(--border-color); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.12); padding:6px; min-width:210px;">
                            <div style="font-size:11px; color:#6B7280; padding:4px 8px;">Изменить тип текста (выделите фрагмент или обработается весь текст):</div>
                            <button type="button" class="ai-action-btn" data-action="formal">Официальный</button>
                            <button type="button" class="ai-action-btn" data-action="professional">Профессиональный</button>
                            <button type="button" class="ai-action-btn" data-action="simple">Проще</button>
                            <button type="button" class="ai-action-btn" data-action="friendly">Дружелюбный</button>
                            <button type="button" class="ai-action-btn" data-action="shorter">Короче</button>
                            <button type="button" class="ai-action-btn" data-action="longer">Подробнее</button>
                            <button type="button" class="ai-action-btn" data-action="grammar">Исправить ошибки</button>
                        </div>
                    </div>
                </div>
                <textarea id="docContent" class="form-input" placeholder="# Новый документ" style="height:150px; resize:vertical; font-family:monospace;"></textarea>
            </div>
            <style>
                .ai-action-btn {
                    display: block; width: 100%; text-align: left;
                    padding: 8px 10px; margin: 2px 0; border: none;
                    background: transparent; border-radius: 6px; cursor: pointer;
                    font-size: 14px; color: var(--text-color);
                }
                .ai-action-btn:hover { background: #F3F4F6; }
                .ai-action-btn:disabled { opacity: .6; cursor: default; }
            </style>
            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top: 24px;">
                <button type="button" class="button-secondary" onclick="location.href='/'">Отмена</button>
                <button type="submit" class="button-primary" id="submitBtn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>

(function() {
    // Custom Select Logic
    document.querySelectorAll('.custom-select').forEach(wrapper => {
        const styled = wrapper.querySelector('.select-styled');
        const optionsDiv = wrapper.querySelector('.select-options');
        const hiddenInput = document.getElementById(wrapper.dataset.name);

        styled.addEventListener('click', () => {
            document.querySelectorAll('.select-options').forEach(el => { if(el !== optionsDiv) el.style.display = 'none'; });
            document.querySelectorAll('.select-styled').forEach(el => { if(el !== styled) el.classList.remove('active'); });
            optionsDiv.style.display = optionsDiv.style.display === 'block' ? 'none' : 'block';
            styled.classList.toggle('active');
        });

        window.addEventListener('click', (e) => {
            if (!wrapper.contains(e.target)) {
                optionsDiv.style.display = 'none';
                styled.classList.remove('active');
            }
        });
    });

    function addOption(wrapperId, value, text, onSelect) {
        const wrapper = document.getElementById(wrapperId);
        const optionsDiv = wrapper.querySelector('.select-options');
        const option = document.createElement('div');
        option.className = 'select-option';
        option.textContent = text;
        option.dataset.value = value;
        option.addEventListener('click', () => {
            wrapper.querySelector('.select-styled').textContent = text;
            wrapper.querySelector('.select-styled').style.color = 'var(--text-color)';
            document.getElementById(wrapper.dataset.name).value = value;
            optionsDiv.style.display = 'none';
            if (onSelect) onSelect(value);
        });
        optionsDiv.appendChild(option);
    }

    async function fetchSpaces() {
        try {
            // Очищаем список опций перед загрузкой
            const spaceWrapper = document.getElementById('docSpaceWrapper');
            const optionsDiv = spaceWrapper.querySelector('.select-options');
            optionsDiv.innerHTML = ''; 

            // Запрашиваем только те пространства, в которые у пользователя есть право WRITE
            // Мы явно передаем requiredAccess=WRITE. 
            // Теперь в SpaceService для READER это право будет проверяться ТОЛЬКО по таблице space_permissions.
            const spaces = await apiFetch('/api/spaces?requiredAccess=WRITE&size=100');

            if (!spaces || spaces.length === 0) {
                spaceWrapper.querySelector('.select-styled').textContent = 'Нет доступных пространств для записи';
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            spaces.forEach(s => addOption('docSpaceWrapper', s.id, s.name, (id) => {
                fetchParentDocuments(id);
            }));
            
            // Если передан spaceId в URL, выбираем его автоматически
            const urlParams = new URLSearchParams(window.location.search);
            const preselectedSpaceId = urlParams.get('spaceId');
            const preselectedParentId = urlParams.get('parentId');
            
            if (preselectedParentId && !preselectedSpaceId) {
                // Если передан parentId без spaceId — загружаем родительский документ, чтобы узнать spaceId
                try {
                    const parentDoc = await apiFetch(`/api/documents/${preselectedParentId}`);
                    if (parentDoc && parentDoc.spaceId) {
                        const parentSpace = spaces.find(s => s.id == parentDoc.spaceId);
                        if (parentSpace) {
                            spaceWrapper.querySelector('.select-styled').textContent = parentSpace.name;
                            spaceWrapper.querySelector('.select-styled').style.color = 'var(--text-color)';
                            document.getElementById('docSpace').value = parentDoc.spaceId;
                            await fetchParentDocuments(parentDoc.spaceId, preselectedParentId);
                            return;
                        }
                    }
                } catch (e) {
                    console.error('Failed to fetch parent doc:', e);
                }
            }
            
            if (preselectedSpaceId) {
                const space = spaces.find(s => s.id == preselectedSpaceId);
                if (space) {
                    spaceWrapper.querySelector('.select-styled').textContent = space.name;
                    spaceWrapper.querySelector('.select-styled').style.color = 'var(--text-color)';
                    document.getElementById('docSpace').value = space.id;
                    await fetchParentDocuments(space.id, preselectedParentId);
                } else if (preselectedParentId) {
                    // Спейс не найден по spaceId, но есть parentId — попробуем подтянуть parent
                    try {
                        const parentDoc = await apiFetch(`/api/documents/${preselectedParentId}`);
                        if (parentDoc && parentDoc.spaceId) {
                            const parentSpace = spaces.find(s => s.id == parentDoc.spaceId);
                            if (parentSpace) {
                                spaceWrapper.querySelector('.select-styled').textContent = parentSpace.name;
                                spaceWrapper.querySelector('.select-styled').style.color = 'var(--text-color)';
                                document.getElementById('docSpace').value = parentDoc.spaceId;
                                await fetchParentDocuments(parentDoc.spaceId, preselectedParentId);
                            }
                        }
                    } catch (e) {
                        console.error('Failed to fetch parent doc:', e);
                    }
                }
            } else if (preselectedParentId) {
                // Есть только parentId, без spaceId
                try {
                    const parentDoc = await apiFetch(`/api/documents/${preselectedParentId}`);
                    if (parentDoc && parentDoc.spaceId) {
                        const parentSpace = spaces.find(s => s.id == parentDoc.spaceId);
                        if (parentSpace) {
                            spaceWrapper.querySelector('.select-styled').textContent = parentSpace.name;
                            spaceWrapper.querySelector('.select-styled').style.color = 'var(--text-color)';
                            document.getElementById('docSpace').value = parentDoc.spaceId;
                            await fetchParentDocuments(parentDoc.spaceId, preselectedParentId);
                        }
                    }
                } catch (e) {
                    console.error('Failed to fetch parent doc:', e);
                }
            }
        } catch (e) { 
            console.error('Failed to fetch spaces:', e);
            showToast(e.message || 'Ошибка при загрузке пространств', 'error');
        }
    }

    async function fetchTemplates() {
        try {
            const templates = await apiFetch('/api/templates');
            templates.forEach(t => addOption('docTemplateWrapper', t.id, t.name, (id) => {
                const template = templates.find(temp => temp.id == id);
                if (template) document.getElementById('docContent').value = template.content;
            }));
        } catch (e) { console.error(e); }
    }

    async function fetchParentDocuments(spaceId, preselectedParentId) {
        try {
            const data = await apiFetch(`/api/documents?spaceId=${spaceId}`);
            // Обработка возможного объекта ответа с полем content, если пагинация активна
            const documents = Array.isArray(data) ? data : (data.content || []);
            const parentWrapper = document.getElementById('docParentWrapper');
            parentWrapper.querySelector('.select-options').innerHTML = '';
            addOption('docParentWrapper', '', 'Без родителя (корневой)');
            
            let foundParent = false;
            documents.forEach(d => addOption('docParentWrapper', d.id, d.title));
            
            if (preselectedParentId) {
                const parentOption = parentWrapper.querySelector(`.select-option[data-value="${preselectedParentId}"]`);
                if (parentOption) {
                    parentOption.click();
                    foundParent = true;
                }
            }
            
            if (!foundParent) {
                document.getElementById('docParent').value = '';
                parentWrapper.querySelector('.select-styled').textContent = 'Без родителя (корневой)';
            }
        } catch (e) { console.error(e); }
    }

    async function createDocument() {
        const title = document.getElementById('docTitle').value.trim();
        const spaceId = document.getElementById('docSpace').value;
        const content = document.getElementById('docContent').value;
        const templateId = document.getElementById('docTemplate').value;
        const parentId = document.getElementById('docParent').value;

        if (!title || !spaceId) {
            showToast('Заголовок и пространство обязательны', 'error');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Создание...';

            try {
            const body = { title, spaceId: parseInt(spaceId), content };
            if (templateId) body.templateId = parseInt(templateId);
            if (parentId) body.parentId = parseInt(parentId);

            const document = await apiFetch('/api/documents', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            showToast('Документ успешно создан');
            setTimeout(() => { location.href = '/'; }, 1000);
        } catch (e) {
            btn.disabled = false;
            btn.textContent = 'Сохранить';
        }
    }

    // ── Нейроассистент (routerai) ──────────────────────────────────
    function initAiAssistant() {
        const wrapper = document.getElementById('aiAssistant');
        const btn = document.getElementById('aiAssistBtn');
        const panel = document.getElementById('aiAssistPanel');
        const textarea = document.getElementById('docContent');
        if (!wrapper || !btn || !panel || !textarea) return;

        fetch('/api/ai/status', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : { enabled: false })
            .then(s => { if (s && s.enabled) wrapper.style.display = ''; })
            .catch(() => {});

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', (e) => {
            if (!wrapper.contains(e.target)) panel.style.display = 'none';
        });
        panel.querySelectorAll('.ai-action-btn').forEach(actionBtn => {
            actionBtn.addEventListener('click', () => aiTransform(actionBtn.dataset.action));
        });

        async function aiTransform(action) {
            const hasSelection = textarea.selectionStart !== textarea.selectionEnd;
            const start = textarea.selectionStart, end = textarea.selectionEnd;
            const text = hasSelection ? textarea.value.substring(start, end) : textarea.value;
            if (!text.trim()) { showToast('Нет текста для обработки', 'error'); return; }

            panel.style.display = 'none';
            const prev = btn.textContent;
            btn.disabled = true; btn.textContent = '✨ Обработка...';
            try {
                const resp = await fetch('/api/ai/transform', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ text, action })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) { showToast(data.error || 'Ошибка нейроассистента', 'error'); return; }
                const result = data.result || '';
                if (hasSelection) {
                    textarea.setRangeText(result, start, end, 'end');
                } else {
                    textarea.value = result;
                }
                showToast('Готово ✨');
            } catch (e) {
                showToast('Ошибка запроса к нейроассистенту', 'error');
            } finally {
                btn.disabled = false; btn.textContent = prev;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchSpaces();
        fetchTemplates();
        addOption('docParentWrapper', '', 'Без родителя (корневой)');
        document.getElementById('createDocForm').addEventListener('submit', createDocument);
        initAiAssistant();
    });
})();
</script>
