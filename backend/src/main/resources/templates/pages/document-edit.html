<div class="document-edit-page" style="height: calc(100vh - 64px); display: flex; flex-direction: column;">
    <input type="hidden" id="documentId" th:value="${documentId}">
    
    <div class="editor-header">
        <div style="display:flex; align-items:center; gap:12px;">
            <a href="/" class="button-secondary" style="min-width:auto; padding:6px 12px; text-decoration:none;">&larr; Назад</a>
            <h2 style="margin:0; font-size:18px;" id="headerTitle">Редактирование</h2>
        </div>
        <div class="editor-actions">
            <div class="editor-actions">
                <span class="editor-status" id="statusBadge">Draft</span>
                <button class="button-primary" id="saveBtn">Сохранить (Ctrl+S)</button>
            </div>
        </div>
    </div>

    <div class="editor-metadata" style="padding: 12px 24px; border-bottom: 1px solid var(--border-color); background: #F9FAFB; display: flex; gap: 16px; align-items: center;">
            <div class="field" style="display:flex; align-items:center; gap:6px;">
                <label style="font-size:12px; font-weight:600; color:#6B7280; text-transform:uppercase;">Название</label>
                <input type="text" id="docTitleField" style="padding:4px 8px; font-size:13px; border:1px solid var(--border-color); border-radius:4px; min-width:250px;">
            </div>
            <div class="field" style="display:flex; align-items:center; gap:6px;">
                <label style="font-size:12px; font-weight:600; color:#6B7280; text-transform:uppercase;">Статус</label>
                <div class="custom-select" id="docStatusWrapper" data-name="docStatusField">
                    <div class="select-styled" style="min-width: 150px; padding: 4px 8px; font-size: 13px;">...</div>
                    <div class="select-options"></div>
                </div>
                <input type="hidden" id="docStatusField">
            </div>
            <div class="field" style="display:flex; align-items:center; gap:6px; font-size:13px; color:#6B7280;">
                <span>Автор: <span id="authorName">...</span></span>
            </div>
        </div>

    <div class="editor-layout">
        <div class="editor-pane">
                        <div class="pane-header">
                <span class="pane-label">Разметка Wiki</span>
                <span class="pane-hint">Ctrl+S — сохранить</span>
            </div>
            <div class="editor-toolbar">
                <button class="toolbar-btn" onclick="wrapText('**','**')" title="Полужирный"><strong>B</strong></button>
                <button class="toolbar-btn" onclick="wrapText('_','_')" title="Курсив"><em>I</em></button>
                <button class="toolbar-btn" onclick="insertAtCursor('\n- ')" title="Маркированный список">• Список</button>
                <button class="toolbar-btn" onclick="insertAtCursor('\n1. ')" title="Нумерованный список">1. Список</button>
                <button class="toolbar-btn" onclick="insertAtCursor('\n```\n')" title="Блок кода">&lt;/&gt;</button>
                <button class="toolbar-btn" onclick="insertAtCursor('## ')" title="Заголовок H2">H2</button>
            </div>
            <textarea id="editorTextarea" class="editor-textarea" placeholder="Введите текст в формате Markdown..."></textarea>
        </div>
        <div class="preview-pane">
            <div class="pane-header">
                <span class="pane-label">Предпросмотр</span>
                <span class="pane-hint">Обновляется в реальном времени</span>
            </div>
            <div id="previewContent" class="preview-content">
                <!-- Отрендеренный HTML -->
            </div>
        </div>
    </div>
</div>


<!-- Подключаем marked.js для рендеринга Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
(function() {
    const docId = document.getElementById('documentId').value;
    const textarea = document.getElementById('editorTextarea');
    const preview = document.getElementById('previewContent');
    let currentDoc = null;

    function updateStatusBadge() {
        const status = document.getElementById('docStatusField').value;
        const badge = document.getElementById('statusBadge');
        badge.textContent = status;
        badge.className = 'editor-status';
        badge.style.background = (status === 'Draft' || status === 'DRAFT') ? '#FEF3C7' : (status === 'Published' || status === 'PUBLISHED') ? '#DCFCE7' : '#FEE2E2';
        badge.style.color = (status === 'Draft' || status === 'DRAFT') ? '#92400E' : (status === 'Published' || status === 'PUBLISHED') ? '#166534' : '#991B1B';
    }

    async function loadDocument() {
        try {
            currentDoc = await apiFetch(`/api/documents/${docId}`);
            document.getElementById('docTitleField').value = currentDoc.title;
            
            // Set status in custom select
            document.getElementById('docStatusField').value = currentDoc.status;
            const statusLabel = {
                'DRAFT': 'Черновик',
                'PUBLISHED': 'Опубликовано',
                'DELETED': 'Удалено'
            }[currentDoc.status] || currentDoc.status;
            document.querySelector('#docStatusWrapper .select-styled').textContent = statusLabel;

            document.getElementById('authorName').textContent = currentDoc.authorId;
            document.getElementById('headerTitle').textContent = currentDoc.title;
            textarea.value = currentDoc.content || '';
            updateStatusBadge();
            renderPreview();
        } catch (e) {
            showToast('Ошибка загрузки документа', 'error');
        }
    }

    // Initialize custom select
    document.addEventListener('DOMContentLoaded', () => {
        window.initCustomSelects();
        ['DRAFT', 'PUBLISHED', 'DELETED'].forEach(val => {
            const label = { 'DRAFT': 'Черновик', 'PUBLISHED': 'Опубликовано', 'DELETED': 'Удалено' }[val];
            window.populateCustomSelect('docStatusWrapper', val, label, () => {
                updateStatusBadge();
            });
        });
        loadDocument();
    });
</script>
