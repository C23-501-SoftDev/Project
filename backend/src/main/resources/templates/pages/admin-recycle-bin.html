<div class="admin-recycle-bin-page">
    <div class="header">
        <h1>Корзина документов</h1>
    </div>

    <div class="filter-bar" style="margin-bottom: 20px;">
        <div class="filter-group">
            <label>Пространство:</label>
            <div class="custom-select" id="spaceFilterWrapper" data-target="spaceFilter" style="width: 200px;">
                <div class="select-styled">Все пространства</div>
                <div class="select-options">
                    <div class="select-option" data-value="">Все пространства</div>
                </div>
            </div>
            <input type="hidden" id="spaceFilter" value="">
        </div>
        <div class="filter-group">
            <label>Автор:</label>
            <div class="custom-select" id="authorFilterWrapper" data-target="authorFilter" style="width: 180px;">
                <div class="select-styled">Все авторы</div>
                <div class="select-options">
                    <div class="select-option" data-value="">Все авторы</div>
                </div>
            </div>
            <input type="hidden" id="authorFilter" value="">
        </div>
        <button class="button-primary" id="applyFiltersBtn">Применить</button>
        <button class="button-secondary" id="clearFiltersBtn">Сбросить</button>
    </div>

    <div style="overflow-x:auto;">
        <table id="recycleBinTable" class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Пространство</th>
                    <th>Автор</th>
                    <th>Прежний статус</th>
                    <th>Дата удаления</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="recycleBinTbody">
                <tr>
                    <td colspan="7" style="text-align:center;">Загрузка...</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="states">
        <p id="recycleBinEmptyMsg" style="display:none; text-align:center;">Корзина пуста</p>
    </div>

    <!-- Модальное окно подтверждения жесткого удаления -->
    <div class="modal" id="hardDeleteModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
        <div class="modal-content" style="background:var(--bg-card, #fff); padding:24px; border-radius:8px; width:400px; max-width:90%;">
            <h3 style="margin-top:0; color:var(--text-main, #333);">Удалить документ навсегда?</h3>
            <p style="color:var(--text-secondary, #666); font-size:14px;">Документ "<span id="hardDeleteDocTitle"></span>" будет окончательно удален из базы данных и Git. Это действие невозможно отменить.</p>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
                <button class="button-secondary" id="cancelHardDeleteBtn">Отмена</button>
                <button class="button-primary" id="confirmHardDeleteBtn" style="background-color: #d9534f; border-color: #d9534f;">Удалить навсегда</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/custom-select.js}"></script>
<script>
    (function () {
        let docToHardDelete = null;

        async function loadFilterOptions() {
            try {
                const [spaces, authors] = await Promise.all([
                    adminFetch('/api/admin/documents/recycle-bin/spaces').catch(() => []),
                    adminFetch('/api/admin/documents/recycle-bin/authors').catch(() => [])
                ]);

                const spaceOptions = document.querySelector('#spaceFilterWrapper .select-options');
                if (spaceOptions) {
                    let html = '<div class="select-option" data-value="">Все пространства</div>';
                    spaces.forEach(s => {
                        html += `<div class="select-option" data-value="${s.id}">${escapeHtml(s.name)}</div>`;
                    });
                    spaceOptions.innerHTML = html;
                }

                const authorOptions = document.querySelector('#authorFilterWrapper .select-options');
                if (authorOptions) {
                    let html = '<div class="select-option" data-value="">Все авторы</div>';
                    authors.forEach(a => {
                        html += `<div class="select-option" data-value="${a.id}">${escapeHtml(a.login)}</div>`;
                    });
                    authorOptions.innerHTML = html;
                }

                if (typeof initCustomSelects === 'function') {
                    initCustomSelects();
                }
            } catch (e) {
                console.error('Failed to load filter options:', e);
            }
        }

        async function fetchRecycleBin() {
            const tbody = document.getElementById('recycleBinTbody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Загрузка...</td></tr>';

            const spaceId = document.getElementById('spaceFilter').value;
            const authorId = document.getElementById('authorFilter').value;

            let url = '/api/admin/documents/recycle-bin';
            const params = new URLSearchParams();
            if (spaceId) params.set('spaceId', spaceId);
            if (authorId) params.set('authorId', authorId);
            if (params.toString()) url += '?' + params.toString();

            try {
                const docs = await adminFetch(url);
                
                if (!docs || docs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Корзина пуста</td></tr>';
                    document.getElementById('recycleBinEmptyMsg').style.display = 'block';
                } else {
                    document.getElementById('recycleBinEmptyMsg').style.display = 'none';
                    tbody.innerHTML = docs.map(d => `
                        <tr>
                            <td>${escapeHtml(d.id)}</td>
                            <td>${escapeHtml(d.title || '')}</td>
                            <td>${escapeHtml(d.spaceName || '')}</td>
                            <td>${escapeHtml(d.authorLogin || '')}</td>
                            <td><span class="badge ${escapeHtml(d.previousStatus || 'DRAFT')}">${escapeHtml(d.previousStatus || 'DRAFT')}</span></td>
                            <td>${d.deletedAt ? escapeHtml(d.deletedAt.replace('T', ' ')) : ''}</td>
                            <td class="actions" style="display:flex; gap:8px;">
                                <button class="button-primary" onclick="window.restoreDocument(${d.id})">Восстановить</button>
                                <button class="button-secondary" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb;" onclick="window.promptHardDelete(${d.id}, '${escapeHtml(d.title || '').replace(/'/g, "\\'")}')">Удалить навсегда</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Ошибка загрузки корзины</td></tr>';
                console.error('Failed to fetch recycle bin:', e);
            }
        }

        async function restoreDocument(id) {
            try {
                await adminFetch(`/api/admin/documents/${id}/restore`, { method: 'POST' });
                showToast('Документ успешно восстановлен');
                fetchRecycleBin();
                loadFilterOptions();
            } catch (e) {
                showToast('Ошибка восстановления документа', 'error');
                console.error('Failed to restore document:', e);
            }
        }

        function promptHardDelete(id, title) {
            docToHardDelete = id;
            document.getElementById('hardDeleteDocTitle').textContent = title;
            const modal = document.getElementById('hardDeleteModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        async function confirmHardDelete() {
            if (!docToHardDelete) return;
            try {
                await adminFetch(`/api/admin/documents/${docToHardDelete}/hard`, { method: 'DELETE' });
                showToast('Документ окончательно удален');
                closeModal('hardDeleteModal');
                docToHardDelete = null;
                fetchRecycleBin();
                loadFilterOptions();
            } catch (e) {
                showToast('Ошибка окончательного удаления документа', 'error');
                console.error('Failed to hard delete document:', e);
            }
        }

        window.restoreDocument = restoreDocument;
        window.promptHardDelete = promptHardDelete;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadFilterOptions();
            await fetchRecycleBin();
            document.getElementById('applyFiltersBtn').addEventListener('click', () => {
                fetchRecycleBin();
            });

            document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                document.getElementById('spaceFilter').value = '';
                document.querySelector('#spaceFilterWrapper .select-styled').textContent = 'Все пространства';
                document.getElementById('authorFilter').value = '';
                document.querySelector('#authorFilterWrapper .select-styled').textContent = 'Все авторы';
                fetchRecycleBin();
            });

            document.getElementById('cancelHardDeleteBtn').addEventListener('click', () => {
                closeModal('hardDeleteModal');
                docToHardDelete = null;
            });

            document.getElementById('confirmHardDeleteBtn').addEventListener('click', () => {
                confirmHardDelete();
            });
        });
    })();
</script>
