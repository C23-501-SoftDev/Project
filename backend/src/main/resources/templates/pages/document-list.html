<div class="document-list-page">
    <div class="header">
        <h1>Документы</h1>
    </div>

    <div class="filter-bar" style="display: flex; align-items: flex-end; gap: 10px;">
        <div class="filter-group" style="min-width:140px;">
        <label>Статус</label>
        <div class="custom-select" id="statusFilter-wrapper" data-target="statusFilter">
            <div class="select-styled">Все</div>
                <div class="select-options">
                    <div class="select-option" data-value="">Все</div>
                    <div class="select-option" data-value="Draft">Черновик</div>
                    <div class="select-option" data-value="Published">Опубликовано</div>
                    <div class="select-option" data-value="Deleted">Удалено</div>
                </div>

            <input type="hidden" id="statusFilter" value="">
        </div>
        </div>
        <div class="filter-group" style="flex: 1; min-width: 160px;">
            <label>Пространство</label>
            <div class="custom-select" id="spaceFilter-wrapper" data-target="spaceFilter">
                <div class="select-styled">Все пространства</div>
                <div class="select-options">
                    <div class="select-option" data-value="">Все пространства</div>
                </div>
                <input type="hidden" id="spaceFilter" value="">
            </div>
        </div>
        <button class="button-primary" id="applyFiltersBtn">Применить</button>
        <button class="button-secondary" id="clearFiltersBtn">Сбросить</button>
    </div>

    <div class="create-actions" id="createActions" style="margin-top: 5px; margin-bottom: 5px; display: none;">
        <button class="button-primary" id="createBtn" onclick="location.href='/documents/new'">+ Создать документ</button>
    </div>

    <div style="overflow-x:auto;">
        <table id="documentsTable" class="data-table">
            <thead>
                <tr>
                    <th data-sort="id">ID</th>
                    <th data-sort="title">Название</th>
                    <th data-sort="spaceId">Пространство</th>
                    <th data-sort="authorId">Автор</th>
                    <th data-sort="status">Статус</th>
                    <th data-sort="updatedAt">Обновлено</th>
                    <th style="min-width:180px;">Действия</th>
                </tr>
            </thead>
            <tbody id="documentsTbody">
                <tr><td colspan="7" style="text-align:center;">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="documentsPagination" style="margin-top: 20px;">
        <button class="button-secondary" id="documentsPrevBtn" disabled style="padding: 6px 12px; margin: 0 5px;">Назад</button>
        <span id="documentsPageInfo" style="margin: 0 10px;">Страница 1 из 1</span>
        <button class="button-secondary" id="documentsNextBtn" disabled style="padding: 6px 12px; margin: 0 5px;">Вперед</button>
    </div>
</div>

<script>
(function() {
    let state = {
        page: 0,
        size: 20,
        searchTerm: '',
        statusFilter: '',
        spaceFilter: '',
        sortBy: 'id',
        sortDir: 'desc'
    };

    async function fetchSpaces() {
        try {
            const spaces = await apiFetch('/api/spaces');
            const optionsContainer = document.querySelector('#spaceFilter-wrapper .select-options');
            spaces.forEach(s => {
                const div = document.createElement('div');
                div.className = 'select-option';
                div.setAttribute('data-value', s.id);
                div.textContent = s.name;
                optionsContainer.appendChild(div);
            });
            initCustomSelects();
        } catch (e) {
            console.error('Failed to fetch spaces:', e);
        }
    }

    async function fetchDocuments() {
        const tbody = document.getElementById('documentsTbody');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Загрузка...</td></tr>';

        // Загружаем документы с поддержкой пагинации
        let url = `/api/documents?includeDeleted=true&page=${state.page}&size=${state.size}`;
        if (state.spaceFilter) url += `&spaceId=${state.spaceFilter}`;

        try {
            const data = await apiFetch(url);
            const docs = data.content || [];
            state.totalElements = data.totalElements || docs.length;
            state.totalPages = data.totalPages || 1;
            
            // При отображении используем уже полученные с сервера данные
            let itemsToDisplay = docs;
            
            // Если API возвращает только страницу, фильтровать на клиенте не нужно, 
            // так как API уже вернул отфильтрованные данные (если фильтры были переданы на сервер).
            // Если API возвращает все данные, то оставляем фильтрацию здесь.
            
            if (itemsToDisplay.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Документы не найдены</td></tr>';
                document.getElementById('documentsPageInfo').textContent = `Страница 1 из 1`;
                document.getElementById('documentsPrevBtn').disabled = true;
                document.getElementById('documentsNextBtn').disabled = true;
            } else {
                // Получаем уникальные spaceId
                const spaceIds = [...new Set(itemsToDisplay.map(d => d.spaceId))];
                
                // Загружаем права для всех пространств в списке
                const permsMap = {};
                await Promise.all(spaceIds.map(async (sid) => {
                    try {
                        const p = await apiFetch(`/api/user/permissions?spaceId=${sid}`);
                        permsMap[sid] = p;
                    } catch (e) {
                        permsMap[sid] = { canEdit: false };
                    }
                }));

                tbody.innerHTML = itemsToDisplay.map(d => {
                    const canEdit = permsMap[d.spaceId]?.canEdit || false;
                    const isDeleted = d.status === 'DELETED';
                    return `
                    <tr>
                        <td>${d.id}</td>
                        <td><strong>${escapeHtml(d.title)}</strong></td>
                        <td>${d.spaceId}</td>
                        <td>${d.authorId || 'Неизвестно'}</td>
                        <td><span class="badge ${d.status ? d.status.toLowerCase() : ''}">${d.status || 'Draft'}</span></td>
                        <td>${d.updatedAt || '-'}</td>
                        <td class="actions" style="display: flex; align-items: center; gap: 6px;">
                            <a href="#" onclick="window.location.href='/spaces/' + ${d.spaceId} + '/doc/' + encodeURIComponent('${d.title.replace(/'/g, '\\\'')}')" class="button-secondary" style="padding:6px 19px; text-decoration:none; text-align: center;">Просмотр</a>
                            ${canEdit && !isDeleted ? `<a href="#" onclick="window.location.href='/spaces/' + ${d.spaceId} + '/doc/' + encodeURIComponent('${d.title.replace(/'/g, '\\\'')}') + '/edit'" class="button-primary" style="padding:6px 19px; text-decoration:none; text-align: center;">Редактор</a>` : ''}
                            ${canEdit ? (isDeleted ? `<a href="#" onclick="restoreDocument(${d.id}); return false;" class="button-primary" style="padding:6px 19px; text-decoration:none; text-align: center;">Восстановить</a>` : `<button class="button-danger" onclick="deleteDocument(${d.id})" style="padding:6px 12px; margin: 0;">🗑</button>`) : ''}
                        </td>
                    </tr>
                `;}).join('');
                
                updatePagination();
            }
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Ошибка загрузки</td></tr>';
        }
    }

    function updatePagination() {
        const currentPage = state.page + 1;
        document.getElementById('documentsPageInfo').textContent = `Страница ${currentPage} из ${state.totalPages || 1}`;
        document.getElementById('documentsPrevBtn').disabled = state.page <= 0;
        document.getElementById('documentsNextBtn').disabled = state.page >= state.totalPages - 1;
    }

    async function checkCreatePermission() {
        try {
            // Запрашиваем хотя бы одно пространство с правом WRITE
            const spaces = await apiFetch('/api/spaces?requiredAccess=WRITE&size=1');
            if (spaces && spaces.length > 0) {
                document.getElementById('createActions').style.display = 'block';
            }
        } catch (e) {
            console.error('Failed to check create permission:', e);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchSpaces();
        fetchDocuments();
        checkCreatePermission();

        document.getElementById('applyFiltersBtn').addEventListener('click', () => {
            state.statusFilter = document.getElementById('statusFilter').value;
            state.spaceFilter = document.getElementById('spaceFilter').value;
            fetchDocuments();
        });

        document.getElementById('clearFiltersBtn').addEventListener('click', () => {
            const statusWrapper = document.getElementById('statusFilter-wrapper');
            const spaceWrapper = document.getElementById('spaceFilter-wrapper');
            
            document.getElementById('statusFilter').value = '';
            statusWrapper.querySelector('.select-styled').textContent = 'Все';
            
            document.getElementById('spaceFilter').value = '';
            spaceWrapper.querySelector('.select-styled').textContent = 'Все пространства';

            state.searchTerm = '';
            state.statusFilter = '';
            state.spaceFilter = '';
            state.page = 0;
            fetchDocuments();
        });

        // Initialize per-page selector
        // REMOVED: setupPerPageSelect

        document.getElementById('documentsPrevBtn').addEventListener('click', () => {
            if (state.page > 0) { state.page--; fetchDocuments(); }
        });
        document.getElementById('documentsNextBtn').addEventListener('click', () => {
            if (state.page < state.totalPages - 1) { state.page++; fetchDocuments(); }
        });
    });
})();
</script>
