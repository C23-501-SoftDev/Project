<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Администрирование — База знаний'">Администрирование</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <h2>Панель админа</h2>
        <ul>
            <li>
                <a th:href="@{/admin/users}"
                   th:class="${activePage == 'users'} ? 'sidebar-tab active' : 'sidebar-tab'">
                    Пользователи</a>
            </li>
            <li>
                <a th:href="@{/admin/spaces}"
                   th:class="${activePage == 'spaces'} ? 'sidebar-tab active' : 'sidebar-tab'">
                    Пространства</a>
            </li>
            <li>
                <a th:href="@{/admin/recycle-bin}"
                   th:class="${activePage == 'recycle-bin'} ? 'sidebar-tab active' : 'sidebar-tab'">
                    Корзина документов</a>
            </li>
            <li>
                <a th:href="@{/admin/groups}"
                   th:class="${activePage == 'groups'} ? 'sidebar-tab active' : 'sidebar-tab'">
                    Группы</a>
            </li>
            <li>
                <a th:href="@{/admin/settings}"
                   th:class="${activePage == 'settings'} ? 'sidebar-tab active' : 'sidebar-tab'">
                    Настройки</a>
            </li>
        </ul>
    </aside>

    <div class="content">
        <div class="header" id="pageHeader">
            <div class="admin-header-actions">
                <span class="user-name" th:text="${currentUser != null ? currentUser.login : 'Пользователь'}"></span>
                <a th:href="@{/}" class="button-home">На главную</a>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="button-logout">Выйти</button>
                </form>
            </div>
        </div>

        <div class="page-content">
            <div th:replace="~{${content}}"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/admin-common.js}"></script>
</body>
</html>
