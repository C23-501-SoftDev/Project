<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'База знаний'">База знаний</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <!-- Навигационная панель -->
    <nav class="navbar" th:if="${currentUser != null}">
        <div class="navbar-brand">
            <a th:href="@{/}">
                <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 8px;">
                    <path d="M2 6C2 4.89543 2.89543 4 4 4H12V18H4C2.89543 18 2 17.1046 2 16V6Z" fill="var(--primary-light)" stroke="currentColor" stroke-width="2"/>
                    <path d="M22 6C22 4.89543 21.1046 4 20 4H12V18H20C21.1046 18 22 17.1046 22 16V6Z" fill="var(--primary-light)" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 4V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M5 8H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M5 11H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M5 14H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M15 8H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M15 11H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M17 14H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                </svg>
                База знаний
            </a>
        </div>
        <a th:href="@{/documents/new}" class="button-primary" style="display:none; text-decoration:none; white-space:nowrap;" id="headerCreateDocBtn">+ Создать документ</a>
        <div class="navbar-search">
            <form th:action="@{/search}" method="get">
                <input type="text" name="q" class="search-query" placeholder="Поиск документов..."
                    th:value="${searchQuery}">
                <input type="date" name="dateFrom" class="search-date" th:value="${searchDateFrom}">
                <input type="date" name="dateTo" class="search-date" th:value="${searchDateTo}">
                <button type="submit" class="button-primary">Найти</button>
            </form>
        </div>
        <div class="navbar-menu">
            <span class="user-info" th:text="${currentUser.login}">Пользователь</span>
            <span class="user-role" th:text="${currentUser.role.name()}">Роль</span>
            <a th:if="${currentUser.admin}" th:href="@{/admin/users}" class="button-primary"
                style="text-decoration:none;">Админ-панель</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="button-danger">Выйти</button>
            </form>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container">
        <!-- Боковая панель -->
        <aside class="sidebar" th:if="${currentUser != null}" id="spacesSidebar">
            <div class="sidebar-header">
                <h3>Пространства</h3>
                <form class="sidebar-search" id="spaceSearchForm" autocomplete="off">
                    <input type="search" id="spaceSearchInput" class="sidebar-search-input"
                        placeholder="Поиск по названию"
                        aria-label="Поиск пространства">
                    <button type="submit" class="button-secondary">Найти</button>
                </form>
            </div>
            <div class="sidebar-search-status" id="spaceSearchStatus" hidden></div>
            <div class="space-tree" id="spaceTreeContainer" th:if="${spaces != null}">
                <ul class="space-list">
                    <li th:each="space : ${spaces}" class="space-item" th:data-space-id="${space.id}">
                        <button type="button" class="space-button" th:onclick="'toggleSpaceTree(' + ${space.id} + ')'"
                            th:text="${space.name}"
                            th:classappend="${currentSpace != null && currentSpace.id == space.id} ? 'active'"
                            th:data-space-id="${space.id}">
                            Пространство
                        </button>
                        <!-- Дерево отображается, если оно было загружено, скрытие/раскрытие через JS -->
                        <div th:id="'tree-' + ${space.id}"
                            th:style="${currentSpace != null && currentSpace.id == space.id} ? 'display:block' : 'display:none'">
                            <div th:if="${spaceTrees != null && spaceTrees.get(space.id) != null}">
                                <div
                                    th:replace="~{fragments/document-tree :: documentTree(${spaceTrees.get(space.id)}, false)}">
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="space-search-results" id="spaceSearchResults" hidden></div>
        </aside>

        <!-- Главная область контента -->
        <main class="main-content">
            <div th:replace="~{${content}}">
                <!-- Контент страницы будет вставлен здесь -->
            </div>
        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/custom-select.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const createBtn = document.getElementById('headerCreateDocBtn');
            if (!createBtn) return;

            // Пытаемся найти контекст: spaceId и documentId
            let spaceId = null;
            let documentId = null;

            // 1. Ищем на корневом элементе страницы data-space-id (space-view или document-view)
            const pageRoot = document.querySelector('[data-space-id]');
            if (pageRoot) {
                spaceId = pageRoot.dataset.spaceId;
            }

            // 2. Ищем скрытый input #documentId (document-view, document-edit)
            const docInput = document.getElementById('documentId');
            if (docInput) {
                documentId = docInput.value;
                // Если data-space-id не нашли, пробуем получить spaceId через API (если загружена страница с документом)
                if (!spaceId && documentId) {
                    try {
                        const doc = await apiFetch(`/api/documents/${documentId}`);
                        if (doc && doc.spaceId) {
                            spaceId = doc.spaceId;
                        }
                    } catch (e) {
                        // Не удалось — оставляем spaceId = null
                    }
                }
            }

            try {
                const spaces = await apiFetch('/api/spaces?requiredAccess=WRITE&size=1');
                if (spaces && spaces.length > 0) {
                    createBtn.style.display = '';
                    // Формируем ссылку с контекстом
                    let url = '/documents/new';
                    const params = [];
                    if (spaceId) params.push('spaceId=' + encodeURIComponent(spaceId));
                    if (documentId) params.push('parentId=' + encodeURIComponent(documentId));
                    if (params.length > 0) url += '?' + params.join('&');
                    createBtn.href = url;
                }
            } catch (e) {
                console.error('Failed to check create permission:', e);
            }
        });
    </script>
</body>

</html>
