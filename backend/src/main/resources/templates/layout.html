<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'База знаний'">База знаний</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar" th:if="${currentUser != null}">
        <div class="navbar-brand">
            <a th:href="@{/}">База знаний</a>
        </div>
        <a th:href="@{/documents/new}" class="button-primary" style="display:none; text-decoration:none; white-space:nowrap;" id="headerCreateDocBtn">+ Создать документ</a>
        <div class="navbar-search">
            <form th:action="@{/search}" method="get">
                <input type="text" name="q" placeholder="Поиск документов..." th:value="${searchQuery}">
                <button type="submit" class="button-primary">Найти</button>
            </form>
        </div>
        <div class="navbar-menu">
                    <span class="user-info" th:text="${currentUser.login}">Пользователь</span>
                    <span class="user-role" th:text="${currentUser.role.name()}">Роль</span>
                    <a th:if="${currentUser.admin}" th:href="@{/admin/users}" class="button-primary" style="text-decoration:none;">Админ-панель</a>
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="button-danger">Выйти</button>
                    </form>
                </div>
    </nav>

    <!-- Основной контент -->
    <div class="container">
        <!-- Боковая панель -->
        <aside class="sidebar" th:if="${currentUser != null}">
            <div class="sidebar-header">
                <h3>Пространства</h3>
            </div>
            <div class="space-tree" th:if="${spaces != null}">
                <ul class="space-list">
                    <li th:each="space : ${spaces}" class="space-item">
                        <button type="button" 
                                class="space-button"
                                th:onclick="'toggleSpaceTree(' + ${space.id} + ')'"
                                th:text="${space.name}"
                                th:classappend="${currentSpace != null && currentSpace.id == space.id} ? 'active'">
                            Пространство
                        </button>
                        <!-- Дерево отображается, если оно было загружено, скрытие/раскрытие через JS -->
                        <div th:id="'tree-' + ${space.id}" 
                             th:style="${currentSpace != null && currentSpace.id == space.id} ? 'display:block' : 'display:none'">
                            <div th:if="${spaceTrees != null && spaceTrees.get(space.id) != null}">
                                <div th:replace="~{fragments/document-tree :: documentTree(${spaceTrees.get(space.id)})}"></div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Главная область контента -->
        <main class="main-content">
            <div th:replace="~{${content}}">
                <!-- Контент страницы будет вставлен здесь -->
            </div>
        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/custom-select.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const createBtn = document.getElementById('headerCreateDocBtn');
            if (!createBtn) return;

            // Пытаемся найти контекст: spaceId и documentId
            let spaceId = null;
            let documentId = null;

            // 1. Ищем на корневом элементе страницы data-space-id (space-view или document-view)
            const pageRoot = document.querySelector('[data-space-id]');
            if (pageRoot) {
                spaceId = pageRoot.dataset.spaceId;
            }

            // 2. Ищем скрытый input #documentId (document-view, document-edit)
            const docInput = document.getElementById('documentId');
            if (docInput) {
                documentId = docInput.value;
                // Если data-space-id не нашли, пробуем получить spaceId через API (если загружена страница с документом)
                if (!spaceId && documentId) {
                    try {
                        const doc = await apiFetch(`/api/documents/${documentId}`);
                        if (doc && doc.spaceId) {
                            spaceId = doc.spaceId;
                        }
                    } catch (e) {
                        // Не удалось — оставляем spaceId = null
                    }
                }
            }

            try {
                const spaces = await apiFetch('/api/spaces?requiredAccess=WRITE&size=1');
                if (spaces && spaces.length > 0) {
                    createBtn.style.display = '';
                    // Формируем ссылку с контекстом
                    let url = '/documents/new';
                    const params = [];
                    if (spaceId) params.push('spaceId=' + encodeURIComponent(spaceId));
                    if (documentId) params.push('parentId=' + encodeURIComponent(documentId));
                    if (params.length > 0) url += '?' + params.join('&');
                    createBtn.href = url;
                }
            } catch (e) {
                console.error('Failed to check create permission:', e);
            }
        });
    </script>
</body>
</html>
